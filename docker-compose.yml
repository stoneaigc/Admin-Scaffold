services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      # 默认 SQLite：开箱即跑，数据落在挂载卷 ./data/app.db
      DB_TYPE: sqlite
      SQLITE_PATH: /app/server/data/app.db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      TOKEN_TTL: ${TOKEN_TTL:-86400}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-超级管理员}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/server/data   # SQLite 文件持久化

  # 前端（可选）：本地开发用 `cd portal && npm run dev`；生产可用下面这个 nginx 构建
  # frontend:
  #   build: ./portal
  #   restart: unless-stopped
  #   depends_on:
  #     - server
  #   ports:
  #     - "8080:80"

  # ===== 生产可选：改用 PostgreSQL =====
