services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      # 默认 SQLite：开箱即跑，数据落在挂载卷 ./data/app.db
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      TOKEN_TTL: ${TOKEN_TTL:-86400}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-超级管理员}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data          # SQLite 文件持久化
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 前端：容器内 build 静态产物，用 nginx 托管并反代 /api 到 server。
  # 只用后端 API 的话可以注释掉这一段。
  frontend:
    build: ./portal
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

  # ===== 生产可选：改用 PostgreSQL =====
